<h1>Quick</h1>
<div id="form">{#fragment form}
<form method="post" action="/quick" gw-target="form">@gweb::csrf_field(ctx)
{#if props.done}<p id="done">Thanks {props.form.email}</p>{/if}
<p><label>Email <input name="email" value="@gweb::field_value(req, "email", props.form.email)"@gweb::invalid(props.errs, "email")></label>@gweb::field_error(props.errs, "email")</p>
<p><label>Name <input name="name" value="@gweb::field_value(req, "name", props.form.name)"></label></p>
<button>Send</button>
</form>
{/fragment}</div>
