<h1>All {{ props.items.len }} products</h1>
{{#if !props.ok}}<p>The database is not available.</p>{{/if}}
<table>
<tr><th>Name</th><th>Category</th><th>Price</th><th>About</th></tr>
{{#for p in props.items}}
<tr><td><a href="/db/products/{{ p.id }}">{{ p.name }}</a></td><td class="cat">{{ p.category }}</td><td class="price">{{> shop::price(p.cents)}}</td><td>{{ p.description }}</td></tr>
{{/for}}
</table>
