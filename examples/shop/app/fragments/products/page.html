<h1>Products with fragments</h1>
<p><a href="/fragments/products" gw-target="results">all</a> <a href="?cat=home" gw-target="results">home</a> <a href="?cat=office" gw-target="results">office</a> <a href="?cat=outdoor" gw-target="results">outdoor</a> <a href="?cat=kitchen" gw-target="results">kitchen</a></p>
<div class="split">
<table>
<tr><th>Name</th><th>Category</th><th>Price</th></tr>
<tbody id="results">{#fragment results}
{#for p in catalog::ITEMS}
{#if props.cat.len == 0 || p.category == props.cat}<tr><td><a href="/fragments/products/{p.id}" gw-target="detail">{p.name}</a></td><td class="cat">{p.category}</td><td class="price">@shop::price(p.cents)</td></tr>{/if}
{/for}
{/fragment}</tbody>
</table>
<aside id="detail"></aside>
</div>
